<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staj Projesi 4 - Renk Paleti Üreteci</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; background: #111; color: white; }
        
        .header { text-align: center; padding: 15px; background: #1e1e1e; display: flex; justify-content: space-between; align-items: center; px-4; }
        h2 { margin: 0; font-size: 18px; color: #ddd; }
        .info { font-size: 13px; color: #888; }
        
        button { background: #4F46E5; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #4338CA; }

        .palette-container { flex: 1; display: flex; flex-wrap: wrap; }
        
        .color-box { flex: 1; min-width: 150px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 40px; cursor: pointer; transition: flex 0.3s ease; }
        .color-box:hover { flex: 1.2; }
        
        .color-code { background: rgba(0, 0, 0, 0.6); padding: 8px 14px; border-radius: 20px; font-family: monospace; font-size: 16px; font-weight: bold; letter-spacing: 1px; backdrop-filter: blur(4px); }
    </style>
</head>
<body>

    <div class="header">
        <h2>Renk Paleti Oluşturucu</h2>
        <span class="info">Yeni palet için <b>Space (Boşluk)</b> tuşuna basın</span>
        <button onclick="generatePalette()">Yenile</button>
    </div>

    <div class="palette-container" id="palette"></div>

    <script>
        function generateHexColor() {
            const chars = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += chars[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        function generatePalette() {
            const container = document.getElementById('palette');
            container.innerHTML = '';

            for (let i = 0; i < 5; i++) {
                const hex = generateHexColor();
                const box = document.createElement('div');
                box.className = 'color-box';
                box.style.backgroundColor = hex;
                box.onclick = () => copyToClipboard(hex);

                box.innerHTML = `<span class="color-code">${hex}</span>`;
                container.appendChild(box);
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert(`${text} renk kodu panoya kopyalandı!`);
        }

        // Space tuşu dinleyicisi
        document.body.onkeyup = function(e) {
            if (e.keyCode === 32) {
                generatePalette();
            }
        };

        // Sayfa ilk yüklendiğinde çalıştır
        generatePalette();
    </script>

</body>
</html>
