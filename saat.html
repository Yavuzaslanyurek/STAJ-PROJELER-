<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staj Projesi 2 - Dijital Saat ve Kronometre</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1e1e2f; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #2b2b40; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); text-align: center; width: 100%; max-width: 360px; }
        h2 { margin-top: 0; color: #a2a2c2; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Dijital Saat Alanı */
        .clock { font-size: 42px; font-weight: bold; color: #00d2ff; margin: 15px 0; font-family: monospace; }
        
        hr { border: 0; height: 1px; background: #3d3d5c; margin: 25px 0; }
        
        /* Kronometre Alanı */
        .stopwatch-display { font-size: 32px; font-weight: bold; color: #ff007f; margin-bottom: 20px; font-family: monospace; }
        .buttons { display: flex; gap: 10px; justify-content: center; }
        button { border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .start { background-color: #28a745; color: white; }
        .stop { background-color: #dc3545; color: white; }
        .reset { background-color: #ffc107; color: #333; }
        button:hover { opacity: 0.85; transform: scale(1.03); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Canlı Saat -->
        <h2>Canlı Saat</h2>
        <div class="clock" id="clock">00:00:00</div>

        <hr>

        <!-- Kronometre -->
        <h2>Kronometre</h2>
        <div class="stopwatch-display" id="stopwatch">00:00:00</div>
        <div class="buttons">
            <button class="start" onclick="startStopwatch()">Başlat</button>
            <button class="stop" onclick="stopStopwatch()">Durdur</button>
            <button class="reset" onclick="resetStopwatch()">Sıfırla</button>
        </div>
    </div>

    <script>
        // --- 1. DİJİTAL SAAT UYGULAMASI ---
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;
        }
        // Saati her saniye güncelle
        setInterval(updateClock, 1000);
        updateClock(); // İlk açılışta beklemeden çalıştır

        // --- 2. KRONOMETRE UYGULAMASI ---
        let timer = null;
        let secondsPassed = 0;

        function formatTime(totalSeconds) {
            const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
            const secs = String(totalSeconds % 60).padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }

        function startStopwatch() {
            if (timer !== null) return; // Zaten çalışıyorsa tekrar başlatma
            timer = setInterval(() => {
                secondsPassed++;
                document.getElementById('stopwatch').innerText = formatTime(secondsPassed);
            }, 1000);
        }

        function stopStopwatch() {
            clearInterval(timer);
            timer = null;
        }

        function resetStopwatch() {
            stopStopwatch();
            secondsPassed = 0;
            document.getElementById('stopwatch').innerText = formatTime(secondsPassed);
        }
    </script>

</body>
</html>
