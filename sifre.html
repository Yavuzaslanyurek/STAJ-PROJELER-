<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staj Projesi 3 - Rastgele Şifre Oluşturucu</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); width: 100%; max-width: 380px; }
        h2 { margin-top: 0; color: #38bdf8; text-align: center; font-size: 20px; }
        
        .output-group { display: flex; gap: 8px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #38bdf8; font-weight: bold; font-family: monospace; font-size: 16px; outline: none; }
        .copy-btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .copy-btn:hover { background: #7dd3fc; }
        
        .setting { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; color: #cbd5e1; }
        .setting input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        
        .generate-btn { width: 100%; background: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; margin-top: 10px; }
        .generate-btn:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Şifre Oluşturucu</h2>
        
        <div class="output-group">
            <input type="text" id="passwordOutput" readonly placeholder="Şifreniz...">
            <button class="copy-btn" onclick="copyPassword()">Kopyala</button>
        </div>

        <div class="setting">
            <label for="length">Karakter Uzunluğu: <span id="lengthVal">12</span></label>
            <input type="range" id="length" min="6" max="32" value="12" oninput="document.getElementById('lengthVal').innerText = this.value">
        </div>

        <div class="setting">
            <label for="uppercase">Büyük Harf Ekle (A-Z)</label>
            <input type="checkbox" id="uppercase" checked>
        </div>

        <div class="setting">
            <label for="numbers">Rakam Ekle (0-9)</label>
            <input type="checkbox" id="numbers" checked>
        </div>

        <div class="setting">
            <label for="symbols">Sembol Ekle (!@#$%^&*)</label>
            <input type="checkbox" id="symbols" checked>
        </div>

        <button class="generate-btn" onclick="generatePassword()">Şifre Üret</button>
    </div>

    <script>
        function generatePassword() {
            const length = document.getElementById('length').value;
            const hasUpper = document.getElementById('uppercase').checked;
            const hasNumbers = document.getElementById('numbers').checked;
            const hasSymbols = document.getElementById('symbols').checked;

            const lowerChars = 'abcdefghijklmnopqrstuvwxyz';
            const upperChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const numberChars = '0123456789';
            const symbolChars = '!@#$%^&*()_+-=[]{}|;:,.<>?';

            let allowedChars = lowerChars;
            if (hasUpper) allowedChars += upperChars;
            if (hasNumbers) allowedChars += numberChars;
            if (hasSymbols) allowedChars += symbolChars;

            let password = '';
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * allowedChars.length);
                password += allowedChars[randomIndex];
            }

            document.getElementById('passwordOutput').value = password;
        }

        function copyPassword() {
            const passInput = document.getElementById('passwordOutput');
            if (!passInput.value) return;

            passInput.select();
            navigator.clipboard.writeText(passInput.value);
            alert('Şifre panoya kopyalandı!');
        }

        // Sayfa ilk açıldığında otomatik bir tane üret
        generatePassword();
    </script>

</body>
</html>
