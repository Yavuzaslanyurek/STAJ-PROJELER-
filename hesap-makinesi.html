<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staj Projesi 10 - Hesap Makinesi</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .calculator { background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 320px; }
        
        .display { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 20px; text-align: right; }
        .previous-op { color: #64748b; font-size: 14px; min-height: 20px; font-family: monospace; }
        .current-op { color: #38bdf8; font-size: 28px; font-weight: bold; font-family: monospace; word-wrap: break-word; min-height: 35px; }

        .buttons-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { background: #334155; color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.1s; }
        button:hover { background: #475569; }
        button:active { transform: scale(0.95); }

        .btn-operator { background: #0284c7; color: white; }
        .btn-operator:hover { background: #0369a1; }

        .btn-clear { background: #ef4444; color: white; grid-column: span 2; }
        .btn-clear:hover { background: #dc2626; }

        .btn-equal { background: #10b981; color: white; grid-column: span 2; }
        .btn-equal:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display">
            <div class="previous-op" id="previousOp"></div>
            <div class="current-op" id="currentOp">0</div>
        </div>

        <div class="buttons-grid">
            <button class="btn-clear" onclick="clearDisplay()">C</button>
            <button class="btn-operator" onclick="appendOperator('/')">÷</button>
            <button class="btn-operator" onclick="appendOperator('*')">×</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="btn-operator" onclick="appendOperator('-')">-</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="btn-operator" onclick="appendOperator('+')">+</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="btn-equal" onclick="calculate()">=</button>

            <button onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendNumber('.')">.</button>
        </div>
    </div>

    <script>
        let currentInput = '';
        let previousInput = '';
        let operator = null;

        const currentOpElement = document.getElementById('currentOp');
        const previousOpElement = document.getElementById('previousOp');

        function updateDisplay() {
            currentOpElement.innerText = currentInput === '' ? '0' : currentInput;
            if (operator !== null) {
                previousOpElement.innerText = `${previousInput} ${operator}`;
            } else {
                previousOpElement.innerText = '';
            }
        }

        function appendNumber(number) {
            if (number === '.' && currentInput.includes('.')) return;
            currentInput += number;
            updateDisplay();
        }

        function appendOperator(op) {
            if (currentInput === '' && previousInput === '') return;
            if (currentInput === '' && previousInput !== '') {
                operator = op;
                updateDisplay();
                return;
            }
            if (previousInput !== '') {
                calculate();
            }
            operator = op;
            previousInput = currentInput;
            currentInput = '';
            updateDisplay();
        }

        function calculate() {
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(current)) return;

            switch (operator) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': 
                    result = current === 0 ? 'Hata' : prev / current; 
                    break;
                default: return;
            }

            currentInput = result.toString();
            operator = null;
            previousInput = '';
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '';
            previousInput = '';
            operator = null;
            updateDisplay();
        }
    </script>

</body>
</html>
