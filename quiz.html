<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staj Projesi 7 - İnteraktif Quiz Uygulaması</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); width: 100%; max-width: 420px; }
        h2 { margin-top: 0; color: #38bdf8; font-size: 18px; margin-bottom: 15px; }
        
        .question-text { font-size: 16px; font-weight: 600; margin-bottom: 20px; line-height: 1.4; }
        
        .options-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .option-btn { background: #334155; color: white; border: none; padding: 12px 15px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 14px; transition: 0.2s; }
        .option-btn:hover:not(:disabled) { background: #475569; }
        .option-btn.correct { background: #10b981 !important; }
        .option-btn.wrong { background: #ef4444 !important; }

        .next-btn { width: 100%; background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; display: none; }
        .next-btn:hover { background: #2563eb; }

        .score-container { text-align: center; display: none; }
        .score-container h3 { color: #10b981; font-size: 24px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <div id="quizBox">
            <h2 id="progressTitle">Soru 1 / 4</h2>
            <div class="question-text" id="questionText">Soru yükleniyor...</div>
            <div class="options-group" id="optionsGroup"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Sonraki Soru</button>
        </div>

        <div class="score-container" id="scoreBox">
            <h3>Quiz Tamamlandı!</h3>
            <p id="scoreText" style="font-size: 16px; margin-bottom: 20px;"></p>
            <button class="next-btn" style="display: block;" onclick="restartQuiz()">Yeniden Başla</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "HTML kısaltmasının açılımı nedir?",
                options: ["Hyper Text Markup Language", "High Tech Modern Language", "Hyper Transfer Machine Language", "Home Tool Markup Language"],
                correct: 0
            },
            {
                question: "Stil ve tasarım (renkler, fontlar) için hangi dil kullanılır?",
                options: ["JavaScript", "HTML", "CSS", "Python"],
                correct: 2
            },
            {
                question: "Aşağıdakilerden hangisi bir JavaScript veri tipi değildir?",
                options: ["String", "Boolean", "Float", "Undefined"],
                correct: 2
            },
            {
                question: "Tarayıcıda verileri kalıcı olarak saklamak için hangisi kullanılır?",
                options: ["LocalStorage", "Console.log", "Function", "Document.write"],
                correct: 0
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        function loadQuiz() {
            resetState();
            const currentQuiz = quizData[currentQuestionIndex];
            
            document.getElementById('progressTitle').innerText = `Soru ${currentQuestionIndex + 1} / ${quizData.length}`;
            document.getElementById('questionText').innerText = currentQuiz.question;

            const optionsGroup = document.getElementById('optionsGroup');
            currentQuiz.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => selectOption(btn, index);
                optionsGroup.appendChild(btn);
            });
        }

        function resetState() {
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('optionsGroup').innerHTML = '';
        }

        function selectOption(selectedBtn, selectedIndex) {
            const currentQuiz = quizData[currentQuestionIndex];
            const buttons = document.querySelectorAll('.option-btn');

            // Tüm butonları kilitle
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === currentQuiz.correct) {
                selectedBtn.classList.add('correct');
                score++;
            } else {
                selectedBtn.classList.add('wrong');
                // Doğru olanı yeşil yap
                buttons[currentQuiz.correct].classList.add('correct');
            }

            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuiz();
            } else {
                document.getElementById('quizBox').style.display = 'none';
                document.getElementById('scoreBox').style.display = 'block';
                document.getElementById('scoreText').innerText = `${quizData.length} sorudan ${score} tanesini doğru bildiniz!`;
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('quizBox').style.display = 'block';
            document.getElementById('scoreBox').style.display = 'none';
            loadQuiz();
        }

        // İlk açılışta başlat
        loadQuiz();
    </script>

</body>
</html>
